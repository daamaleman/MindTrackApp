<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="purpleGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b7fd9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d4fa8;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="shadowGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Fondo blanco/transparente -->
  <!-- <rect width="200" height="200" fill="#ffffff"/> -->

  <!-- Sombra sutil -->
  <circle cx="100" cy="100" r="68" fill="url(#shadowGradient)"/>

  <!-- Silueta de perfil sutil -->
  <path d="M 100 35 C 75 35 60 50 60 70 L 60 130 C 60 140 68 145 80 145 L 100 145 L 100 140 C 85 140 70 135 70 130 L 70 70 C 70 55 80 45 100 45 C 120 45 130 55 130 70 L 130 130 C 130 135 115 140 100 140 L 100 145 L 120 145 C 132 145 140 140 140 130 L 140 70 C 140 50 125 35 100 35 Z"
    fill="#7C5CFF" opacity="0.06"/>

  <!-- Círculo exterior con borde sutil -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="#7C5CFF" stroke-width="1.5" opacity="0.15"/>

  <!-- Círculo blanco interior -->
  <circle cx="100" cy="100" r="62" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Efecto de profundidad -->
  <circle cx="75" cy="75" r="62" fill="url(#shadowGradient)"/>

  <!-- Línea de onda EEG/Pulso cardíaco suavizada -->
  <path d="M 35 100 Q 45 95 55 100 T 75 100 Q 85 85 95 100 Q 105 115 115 100 Q 125 90 135 100 T 160 100"
    stroke="url(#purpleGradientLight)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Puntos de énfasis -->
  <circle cx="95" cy="100" r="1.5" fill="url(#purpleGradientLight)" opacity="0.5"/>
  <circle cx="115" cy="100" r="1.5" fill="url(#purpleGradientLight)" opacity="0.5"/>

  <!-- Línea base sutil -->
  <line x1="35" y1="100" x2="160" y2="100" stroke="url(#purpleGradientLight)" stroke-width="1.8" opacity="0.15" stroke-linecap="round"/>
</svg>

