<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b7fd9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d4fa8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Ícono minimalista - Solo pulso en círculo blanco -->
  <!-- Círculo blanco -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Onda suavizada con Bézier curves (más fluida y armónica) -->
  <path d="M 30 100 Q 45 95 60 100 T 85 100 Q 95 80 105 100 Q 115 120 125 100 T 155 100"
    stroke="url(#purpleGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Línea base con sutil degradado -->
  <line x1="30" y1="100" x2="155" y2="100" stroke="url(#purpleGrad)" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
</svg>

