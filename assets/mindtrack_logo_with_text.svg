<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b7fd9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d4fa8;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="glossGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Fondo púrpura -->
  <rect width="400" height="240" fill="#7C5CFF"/>

  <!-- Icono principal (lado izquierdo) -->
  <g transform="translate(60, 70)">
    <!-- Silueta de perfil sutil -->
    <path d="M 50 20 C 30 20 20 30 20 50 L 20 85 C 20 92 26 95 35 95 L 50 95 L 50 91 C 38 91 25 87 25 85 L 25 50 C 25 38 32 28 50 28 C 68 28 75 38 75 50 L 75 85 C 75 87 62 91 50 91 L 50 95 L 65 95 C 74 95 80 92 80 85 L 80 50 C 80 30 70 20 50 20 Z"
      fill="#ffffff" opacity="0.04"/>

    <!-- Círculo blanco -->
    <circle cx="50" cy="50" r="45" fill="#ffffff"/>

    <!-- Brillo -->
    <circle cx="32" cy="32" r="45" fill="url(#glossGradient)"/>

    <!-- Onda suavizada -->
    <path d="M 15 50 Q 23 46 32 50 T 50 50 Q 58 38 68 50 Q 78 62 88 50"
      stroke="url(#purpleGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Línea base -->
    <line x1="15" y1="50" x2="88" y2="50" stroke="url(#purpleGradient)" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Texto MindTrack -->
  <text x="180" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="2">
    MIND
  </text>
  <text x="180" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="300" fill="#ffffff" letter-spacing="4" opacity="0.9">
    TRACK
  </text>

  <!-- Línea decorativa debajo del texto -->
  <line x1="180" y1="165" x2="395" y2="165" stroke="url(#purpleGradient)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>

